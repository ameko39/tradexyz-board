services:
  - type: web
    name: tradexyz-board
    env: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: node backend/server.mjs
    envVars:
      - key: CORS_ORIGIN
        value: "*"
      - key: POLL_MS
        value: "60000"
      - key: LATEST_MAX_PAGES
        value: "4"
      - key: RETAIN_DAYS
        value: "15"
      - key: DATA_FILE
        value: /data/tg-feeds-store.json
      - key: AI_CAL_FILE
        value: /data/ai-calendar.json
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: tg-feed-data
      mountPath: /data
      sizeGB: 1
