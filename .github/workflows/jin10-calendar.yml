name: Update Jin10 Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
  push:
    paths:
      - ".github/workflows/jin10-calendar.yml"
      - "scripts/update-jin10-calendar.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/update-jin10-calendar.mjs
      - name: Commit updated calendar
        run: |
          if git diff --quiet -- jin10-calendar.json; then
            echo "No calendar changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jin10-calendar.json
          git commit -m "更新金十财经日历数据"
          git push
