name: Update TG Feeds

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
  push:
    paths:
      - ".github/workflows/tg-feeds.yml"
      - "scripts/update-tg-feeds.mjs"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: TG_HTML_DIR=0 node scripts/update-tg-feeds.mjs
      - name: Commit updated TG feeds
        run: |
          if git diff --quiet -- tg-feeds.json; then
            echo "No TG feed changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tg-feeds.json
          git commit -m "更新TG快讯快照"
          git push
